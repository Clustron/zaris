name: author-guard
# Fails if ANY commit in history has an author/committer other than the project identity.
# Server-side backstop for the local pre-commit/pre-push hooks.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-authors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce project authorship
        shell: bash
        run: |
          ALLOWED="heartbeats.zero@gmail.com noreply@github.com"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            HEAD_SHA="${{ github.sha }}"
          fi
          bad=0
          while read -r h ae ce; do
            case " $ALLOWED " in *" $ae "*) : ;; *) echo "::error::commit $h has disallowed author <$ae>"; bad=1;; esac
            case " $ALLOWED " in *" $ce "*) : ;; *) echo "::error::commit $h has disallowed committer <$ce>"; bad=1;; esac
          done < <(git log --format='%H %ae %ce' "$HEAD_SHA")
          if [ "$bad" != 0 ]; then
            echo "Only zeroheartbeat <heartbeats.zero@gmail.com> (and GitHub merges) may appear in this repo's history."
            exit 1
          fi
          echo "All commits are authored by the project identity."
